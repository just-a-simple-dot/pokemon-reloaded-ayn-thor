name: Build APKs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CARGO_NDK_VERSION: 3.5.4
  RUST_VERSION: 1.99.0

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
          - abi: x86_64
            rust: x86_64-linux-android
          - abi: universal
            rust: universal

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      # Installs its own command-line tools instead of trusting the image to ship them where the
      # old script looked, and exports ANDROID_SDK_ROOT / ANDROID_HOME.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          .github/scripts/run-logged.sh sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust targets and cargo-ndk
        shell: bash
        run: |
          set -e
          .github/scripts/run-logged.sh rustup toolchain install "$RUST_VERSION" --profile minimal
          if [ "${{ matrix.abi }}" = "universal" ]; then
            rustup target add --toolchain "$RUST_VERSION" \
              aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          else
            rustup target add --toolchain "$RUST_VERSION" "${{ matrix.rust }}"
          fi
          .github/scripts/run-logged.sh cargo +"$RUST_VERSION" install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build native engine
        working-directory: src/OpenGMK
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.abi }}" = "universal" ]; then
            for a in arm64-v8a armeabi-v7a x86_64; do
              ../../.github/scripts/run-logged.sh cargo +"$RUST_VERSION" ndk -t "$a" --platform 29 build -p gm8emulator --release
            done
          else
            ../../.github/scripts/run-logged.sh cargo +"$RUST_VERSION" ndk -t "${{ matrix.abi }}" --platform 29 build -p gm8emulator --release
          fi

      # With the fork's key in the repo secrets every build is signed the same way, so a new APK
      # installs over the previous one. Without them Gradle falls back to the (per-run) debug key.
      - name: Restore signing key
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Sin secrets de firma: se firma con la clave debug."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/thor.p12
          printf 'storeFile=keystore/thor.p12\nstorePassword=%s\nkeyAlias=thor\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        run: ../.github/scripts/run-logged.sh gradle --no-daemon :app:assembleRelease -PtargetAbi=${{ matrix.abi }}

      - name: Verify architecture
        shell: bash
        run: |
          APK="$(ls android/app/build/outputs/apk/release/pokemon-reloaded-*-${{ matrix.abi }}.apk)"
          test -s "$APK"
          if [ "${{ matrix.abi }}" = "universal" ]; then
            for a in arm64-v8a armeabi-v7a x86_64; do
              unzip -l "$APK" | grep "lib/$a/libgm8emulator.so"
            done
          else
            SO="src/OpenGMK/target/${{ matrix.rust }}/release/libgm8emulator.so"
            test -s "$SO"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$SO"
            unzip -l "$APK" | grep "lib/${{ matrix.abi }}/libgm8emulator.so"
          fi

      - name: Upload APK and native library
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-reloaded-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/*.apk
            src/OpenGMK/target/**/libgm8emulator.so

  # On a version tag, the APKs are published as a GitHub Release so they can be downloaded
  # straight from the device, without logging in or unzipping an artifact.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: pokemon-reloaded-*
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          files: artifacts/**/*.apk
